baseURL = "https://blog.craftedbyadam.dev"
locale = "en"
title = "Adam's Blog!"
theme = "hugo-texify3"
enableRobotsTXT = true
rssLimit = 10

[pagination]
  pagerSize = 5

[taxonomies]
  tags = "tags"
  categories = "categories"

[markup.goldmark.renderer]
  unsafe = true

[markup.highlight]
  noClasses = false

[params]
  title = "Adam's Blog!"
  author = "Adam"
  description = "Thoughts, projects & co-op reports"
  footnote = """
  <a class=link href=https://craftedbyadam.dev target=_blank rel=noopener>Main Site</a> |
  <a class=link href=https://github.com/adam-does-code target=_blank rel=noopener>GitHub</a> |
  Powered by <a class=link href=https://gohugo.io target=_blank rel=noopener>Hugo</a> |
  Theme <a class=link href=https://github.com/michaelneuper/hugo-texify3 target=_blank rel=noopener>TeXify3</a>
  """
  customCSS = []
  customJS = []
  dateFormat = "2 January 2006"
  emphasisWithDots = true
  toc = true
  rootFontSize = "105%"
  math = true
  enableDuckDuckGoSearchBox = false
  numberedSubtitles = true

[[menus.main]]
  name = "GitHub"
  url = "https://github.com/adam-does-code"
  weight = 10
